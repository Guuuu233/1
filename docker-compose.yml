services:
  app:
    build: .
    image: tradingagents-ashare:latest
    container_name: tradingagents-ashare
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./tradingagents:/app/tradingagents
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: sqlite:///./data/tradingagents.db
      TA_APP_SECRET_KEY: ${TA_APP_SECRET_KEY}
      TA_API_KEY: ${TA_API_KEY}
      TA_BASE_URL: ${TA_BASE_URL}
      TA_LLM_PROVIDER: ${TA_LLM_PROVIDER}
      TA_LLM_QUICK: ${TA_LLM_QUICK}
      TA_LLM_DEEP: ${TA_LLM_DEEP}
